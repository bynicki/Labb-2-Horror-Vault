<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horror Vault: More</title>
    <meta
      name="description"
      content="Send in requests for movies to be graded and added on the site, and take part in a quiz."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-logo">
        <h1 class="logo-text">Horror Vault</h1>
      </div>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-item">HOME</a></li>
        <li><a href="index.html#movies-section" class="nav-item">MOVIES</a></li>
        <li><a href="#about" class="nav-item">ABOUT</a></li>
        <li><a href="more.html" class="nav-item">MORE</a></li>
      </ul>
    </nav>

    <img
      class="effect-gif"
      src="pictures/effect.gif"
      alt="Gif of a white item moving"
    />
    <main>
      <section class="movie-request">
        <h2>Request a Movie</h2>

        <p>
          Is there a horror movie you think belongs in the Horror Vault? Send us
          your suggestion!
        </p>

        <form>
          <label for="movie">Movie title:</label>
          <input type="text" id="movie" name="movie" required />
          <label for="year">Release year:</label>
          <input type="number" id="year" name="year" />

          <label for="reason">Why should we add it?</label>
          <textarea id="reason" name="reason" rows="5"></textarea>

          <button type="submit">SEND REQUEST</button>
        </form>
      </section>
    </main>

    <!-- About/footer -->
    <footer class="main-footer">
      <div id="about" class="footer-content">
        <h2>Contact:</h2>
        <p>horrorvault@gmail.com</p>
        <h2>Owner and creator of site:</h2>
        <p>Nicki B</p>
        <p id="rättigheter">
          © 2026 Horror Vault. Alla rättigheter förbehållna.
        </p>
      </div>
    </footer>
  </body>
</html>
